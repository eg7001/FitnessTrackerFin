server {
    # Tell Nginx to listen on port 80 inside the container.
    listen 80;

    # The root directory where your built files live.
    root /usr/share/nginx/html;

    # Default file to serve.
    index index.html;

    location / {
        # Try to serve the requested file directly.
        # If not found, fall back to index.html — this is what makes
        # SPA client-side routing work (e.g. /dashboard won't 404).
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Proxy any request starting with /api/ to the .NET backend.
        # "backend" matches the service name in docker-compose.yml.
        proxy_pass http://backend:8080/;

        # Pass the original host header to the backend.
        proxy_set_header Host $host;

        # Pass the real client IP instead of the container's internal IP.
        proxy_set_header X-Real-IP $remote_addr;
    }
}