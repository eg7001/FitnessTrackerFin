version: "3.9"

services:
  db:
    image: postgres:16-alpine

    container_name: fitness_db

    restart: unless-stopped


    environment:
      POSTGRES_DB: Fitness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


    volumes:
      - postgres_data:/var/lib/postgresql/data


    ports:
      - "5432:5432"


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Fitness"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: fitness_backend

    restart: unless-stopped

    environment:
      - ASPNETCORE_ENVIRONMENT=Production

      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=Fitness;Username=postgres;Password=${POSTGRES_PASSWORD}

      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=FitnessTrackerAPI
      - Jwt__Audience=FitnessTrackerClient
      - Jwt__ExpiresInMinutes=60

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: fitness_frontend

    restart: unless-stopped

    ports:
      - "80:80"


    depends_on:
      - backend



volumes:
  postgres_data:
